<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MCP 学生日程&待办智能助理</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background:#f6f7f9; padding:20px; margin:0; }
        .wrap { max-width: 920px; margin: 0 auto; }
        h1 { text-align:center; font-size:22px; color:#333; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap:20px; }
        .box { background:#fff; padding:18px; border-radius:12px; }
        h3 { margin-top:0; font-size:16px; color:#444; }
        #chatArea { min-height:320px; max-height:320px; overflow-y:auto; border:1px #eee solid; padding:10px; margin-bottom:12px; }
        .msg { margin:6px 0; padding:6px 8px; border-radius:8px; max-width:85%; }
        .userMsg { background:#e6f0ff; color:#165; margin-left:auto; }
        .botMsg { background:#f3f4f6; color:#222; }
        .inputRow { display:flex; gap:8px; }
        input { flex:1; padding:9px; border:1px #ddd solid; border-radius:8px; }
        button { padding:9px 16px; background:#2b78f5; color:white; border:none; border-radius:8px; cursor:pointer; }
        #todoPanel { min-height:320px; max-height:320px; overflow-y:auto; border:1px #eee solid; padding:10px; }
        .todo-item { padding:8px; border-bottom: 1px #f0f0f0 solid; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>📇 MCP 学生日程&待办智能助理</h1>
    <div class="row">
        <div class="box">
            <h3>对话交互</h3>
            <div id="chatArea"></div>
            <div class="inputRow">
                <input id="inp" placeholder="跟我说你的安排，例如：明天晚上7点做高数作业">
                <button onclick="send()">发送</button>
            </div>
        </div>
        <div class="box">
            <h3>待办清单</h3>
            <div id="todoPanel"></div>
        </div>
    </div>
</div>
<script>
async function renderTodos(){
    const res = await fetch("/get_todos");
    const list = await res.json();
    const panel = document.getElementById("todoPanel");
    panel.innerHTML = "";
    if(list.length === 0){
        panel.innerHTML = "<div style='color:#999'>暂无待办任务</div>";
        return;
    }
    list.forEach(it=>{
        // ✅ 重点：取出 plan_time 和 content 拼接文字
        const text = `【${it.plan_time}】 ${it.content}`;
        panel.innerHTML += `<div class="todo-item">${text}</div>`
    })
}
async function send(){
    const text = document.getElementById("inp").value.trim();
    if(!text) return;
    const chat = document.getElementById("chatArea");
    chat.innerHTML += `<div class="msg userMsg">你：${text}</div>`;
    document.getElementById("inp").value = "";
    const r = await fetch("/chat", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ msg:text })
    })
    const ret = await r.json();
    chat.innerHTML += `<div class="msg botMsg">助理：${ret.reply}</div>`;
    chat.scrollTop = chat.scrollHeight;
    renderTodos();
}
// 页面加载刷新清单
window.onload = renderTodos;
</script>
</body>
</html>
