<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学生日程待办智能助理</title>
    <style>
        *{box-sizing: border-box;margin:0;padding:0;font-family:system-ui}
        body{background:#f4f7fa;padding:24px;max-width:900px;margin:0 auto}
        h1{color:#222;margin-bottom:20px;font-size:24px}
        .container{display:grid;grid-template-columns:1fr 1fr;gap:20px}
        .card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px #00000012}
        .chat-box{height:380px;overflow-y:auto;border:1px solid #eee;padding:12px;border-radius:8px;margin-bottom:12px}
        .msg{margin:8px 0;padding:8px 10px;border-radius:6px;max-width:85%}
        .user{background:#e8f3ff;margin-left:auto}
        .bot{background:#f3f4f6}
        .input-area{display:flex;gap:8px}
        input{flex:1;padding:10px;border:1px solid #ddd;border-radius:6px}
        button{padding:10px 16px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer}
        .todo-item{padding:10px;border-bottom:1px solid #eee}
    </style>
</head>
<body>
    <h1>📅 MCP 学生日程&待办智能助理</h1>
    <div class="container">
        <div class="card">
            <h3>对话交互</h3>
            <div class="chat-box" id="chat"></div>
            <div class="input-area">
                <input id="userInput" placeholder="跟我说你的安排，例如：明天晚上7点做高数作业">
                <button onclick="sendMsg()">发送</button>
            </div>
        </div>
        <div class="card">
            <h3>待办清单</h3>
            <div id="todoList"></div>
        </div>
    </div>
    <script>
        function sendMsg(){
            const text = document.getElementById("userInput").value.trim()
            if(!text) return
            addMsg("user", text)
            document.getElementById("userInput").value=""
            fetch("/chat",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({msg:text})
            }).then(r=>r.json()).then(res=>{
                addMsg("bot",res.reply)
                refreshTodo()
            })
        }
        function addMsg(type,text){
            const box=document.getElementById("chat")
            const div=document.createElement("div")
            div.className="msg "+type
            div.innerText=text
            box.appendChild(div)
            box.scrollTop=box.scrollHeight
        }
        function refreshTodo(){
            fetch("/todos")
            .then(r=>r.json())
            .then(data=>{
                const el=document.getElementById("todoList")
                el.innerHTML=""
                data.forEach(item=>{
                    const d=document.createElement("div")
                    d.className="todo-item"
                    d.innerText=`${item.plan_time} | ${item.content}`
                    el.appendChild(d)
                })
            })
        }
        refreshTodo()
    </script>
</body>
</html>
